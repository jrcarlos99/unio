# Dev profile - PostgreSQL database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/matchmaking_dev}
spring.datasource.username=${DB_USERNAME:matchmaking}
spring.datasource.password=${DB_PASSWORD:matchmaking}



spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect



spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Health check detalhado
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always

