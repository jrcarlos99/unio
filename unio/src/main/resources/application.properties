spring.application.name=matchmaking-backend
spring.profiles.active=dev
management.endpoints.web.exposure.include=health,info

# Validade do token JWT de login (em minutos) - 1 hora
app.jwt.expiration-minutes=60

# Recuperação de senha
# Validade do link de redefinição (em minutos) e página do front que recebe o ?token=...
app.password-reset.expiration-minutes=60
app.password-reset.frontend-url=http://localhost:5173/redefinir-senha

app.upload.dir=./uploads/pitch/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Chave de assinatura do JWT. Em produção defina a variável de ambiente JWT_SECRET
# (mínimo 32 caracteres). Sem ela, a aplicação usa a chave de dev e registra um aviso no log.
app.jwt.secret=${JWT_SECRET:matchmaking-dev-secret-key-very-long-1234567890}

# T19 — Swagger/OpenAPI (UI em /swagger-ui/index.html)
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.display-request-duration=true
# URL pública exibida no Swagger (ex.: https://unio-webapp.azurewebsites.net). Vazio = mesma origem.
app.openapi.server-url=${OPENAPI_SERVER_URL:}

# D051: reunião só entre quem deu match mútuo (desligar só em testes antigos ou demonstração)
unio.communication.require-match=true
# D045: máximo de scores calculados por requisição da descoberta (limitação de escala)
unio.discovery.max-calculations-per-request=200
# D054: primeiro administrador, criado na subida se ainda não houver ADMIN.
# Valores só por variável de ambiente; nunca escreva e-mail ou senha aqui.
unio.admin.email=${UNIO_ADMIN_EMAIL:}
unio.admin.password=${UNIO_ADMIN_PASSWORD:}

# D056: origens do front aceitas pelo CORS (lista separada por vírgulas, sem barra no final).
# Em produção defina UNIO_CORS_ALLOWED_ORIGINS no App Service (Configuration > Application settings)
# e reinicie. "*" não é aceito, porque as chamadas levam credenciais.
unio.cors.allowed-origins=${UNIO_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173,https://unio-frontend-drab.vercel.app,https://unio-pi.vercel.app}
# D057: cria as políticas padrão do scorecard se o banco não tiver nenhuma (qualquer perfil).
# Idempotente; false desliga.
unio.scorecard.seed-default-policies=true

# D063: moderação de cadastros e de pitch (RF08). No App Service, defina as variáveis
# UNIO_MODERATION_CADASTRO_REQUER_APROVACAO e UNIO_MODERATION_PITCH_REQUER_APROVACAO para mudar.
# cadastro-requer-aprovacao=false: conta nova entra APROVADO (o ADMIN ainda pode recusar ou suspender).
unio.moderation.cadastro-requer-aprovacao=${UNIO_MODERATION_CADASTRO_REQUER_APROVACAO:false}
# pitch-requer-aprovacao=true: o pitch enviado fica EM_REVISAO até o ADMIN aprovar.
unio.moderation.pitch-requer-aprovacao=${UNIO_MODERATION_PITCH_REQUER_APROVACAO:true}
