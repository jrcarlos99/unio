spring.application.name=matchmaking-backend
spring.profiles.active=dev
management.endpoints.web.exposure.include=health,info

# Validade do token JWT de login (em minutos) - 1 hora
app.jwt.expiration-minutes=60

# Recuperação de senha
# Validade do link de redefinição (em minutos) e página do front que recebe o ?token=...
app.password-reset.expiration-minutes=60
app.password-reset.frontend-url=http://localhost:5173/redefinir-senha

app.upload.dir=./uploads/pitch/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Chave de assinatura do JWT. Em produção defina a variável de ambiente JWT_SECRET
# (mínimo 32 caracteres). Sem ela, a aplicação usa a chave de dev e registra um aviso no log.
app.jwt.secret=${JWT_SECRET:matchmaking-dev-secret-key-very-long-1234567890}
