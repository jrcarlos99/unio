# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy JAR app to Azure Web App - unio-webapp

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    # BANCO DE DADOS TEMPORÁRIO PARA OS TESTES
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: unio
          POSTGRES_PASSWORD: unio
          POSTGRES_DB: unio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      # PASSO NOVO: Cria o usuário ia_reader no banco temporário
      - name: Create ia_reader role in test database
        run: |
          PGPASSWORD=unio psql -h localhost -p 5432 -U unio -d unio_test -c "CREATE ROLE ia_reader WITH LOGIN PASSWORD 'senha_forte_ia';"
        env:
          PGPASSWORD: unio

      - name: Build with Maven
        run: mvn clean install
        working-directory: ./unio
        env:
          # Variáveis para o Spring Boot conectar no banco do container
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/unio_test
          SPRING_DATASOURCE_USERNAME: unio
          SPRING_DATASOURCE_PASSWORD: unio
          # Variáveis de segurança exigidas pelo backend (se necessário)
          JWT_SECRET: chave-de-teste-super-secreta-com-mais-de-32-caracteres

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: '${{ github.workspace }}/unio/target/*.jar'

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout
  
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_110351B4526C498191A532075375DEFC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4875D657636B473F89450279E182749D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0B69A2788EAB4CE08BED7B4DFF368D49 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'unio-webapp'
          slot-name: 'Production'
          package: '*.jar'
